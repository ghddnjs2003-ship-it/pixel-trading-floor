<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>대시보드 진단</title></head>
<body style="font-family:monospace;background:#0b0e13;color:#d3dae5">
<pre id="out">테스트 중…</pre>
<script>
const out = [];
function log(s) { out.push(new Date().toISOString().slice(11, 23) + ' ' + s); document.getElementById('out').textContent = out.join('\n'); }
async function test(name, url, signal) {
  const t0 = performance.now();
  try {
    const res = await fetch(url, { cache: 'no-store', credentials: 'omit', signal });
    const text = await res.text();
    log(`${name}: HTTP ${res.status} in ${(performance.now() - t0).toFixed(0)}ms, len=${text.length}, head=${text.slice(0, 80).replace(/\n/g, '')}`);
  } catch (e) {
    log(`${name}: FAIL in ${(performance.now() - t0).toFixed(0)}ms — ${e && e.name ? e.name : ''}: ${e && e.message}`);
  }
}
const B = 'https://api.bybit.com/v5/market';
async function run() {
  log('시작 — origin: ' + location.origin);
  // 1) AbortController 없이
  await test('tickers(no-signal)', `${B}/tickers?category=linear&symbol=BTCUSDT`);
  // 2) AbortController(9초) 있이 — dashboard.js의 getJSON와 동일
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 9000);
  await test('tickers(signal9s)', `${B}/tickers?category=linear&symbol=BTCUSDT`, ctrl.signal);
  clearTimeout(timer);
  // 3) 캔들(대시보드에서 성공한 것)
  await test('kline(signal9s)', `${B}/kline?category=linear&symbol=BTCUSDT&interval=60&limit=200`, (() => { const c = new AbortController(); setTimeout(() => c.abort(), 9000); return c.signal; })());
  // 4) open-interest
  await test('open-interest', `${B}/open-interest?category=linear&symbol=BTCUSDT&intervalTime=1h&limit=24`);
  // 5) account-ratio
  await test('account-ratio', `${B}/account-ratio?category=linear&symbol=BTCUSDT&period=1h&limit=1`);
  // 6) 전체 tickers(스캐너 — 성공한 것)
  await test('tickers-all', `${B}/tickers?category=linear`);
  log('끝');
}
run();
</script>
</body>
</html>
