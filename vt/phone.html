<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>화면 크기 확인용 미리보기</title>
<style>
  html, body { margin: 0; background: #20202a; color: #cfcfda; font: 12px/1.4 monospace; }
  #f { display: block; background: #000; margin: 0 auto; }
  #bar { position: fixed; left: 0; bottom: 0; padding: 4px 6px; background: #000a; font-size: 11px; }
</style>
</head>
<body>
<iframe id="f" title="미리보기"></iframe>
<div id="bar">미리보기</div>
<script>
  var q = new URLSearchParams(location.search);
  var w = Number(q.get('w')) || 390;
  var h = Number(q.get('h')) || 844;
  var v = q.get('v') || '26';
  var f = document.getElementById('f');
  f.width = w; f.height = h; f.style.width = w + 'px'; f.style.height = h + 'px';
  f.src = '../vt/test.html?v=' + encodeURIComponent(v);
  document.getElementById('bar').textContent = w + '×' + h + ' · v=' + v;
</script>
</body>
</html>
